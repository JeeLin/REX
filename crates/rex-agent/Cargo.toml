[package]
name = "rex-agent"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "rex-agent"
path = "src/rex-agent.rs"

[dependencies]
rex-common = { workspace = true, features = ["embedded-static"] }
libc = { workspace = true }
rex-ssh = { workspace = true }
rex-sip = { workspace = true }
rex-mysql = { workspace = true }
rex-postgresql = { workspace = true }
rex-sqlite = { workspace = true }
rex-redis = { workspace = true }
rex-s3 = { workspace = true }
rex-clickhouse = { workspace = true }
rex-mssql = { workspace = true }
rex-mariadb = { workspace = true }
rex-oracle = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
hostname = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
axum = { workspace = true }
include_dir = { workspace = true }
dotenvy = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }
