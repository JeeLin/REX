<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REX · Setup</title>
<link rel="stylesheet" href="assets/tokens.css"/>
<link rel="stylesheet" href="assets/shell.css"/>
<link rel="stylesheet" href="assets/common.css"/>
<style>
  .setup{height:100vh;display:grid;place-items:center;padding:40px;
    background:radial-gradient(120% 120% at 50% 0%,rgba(232,145,45,.10),transparent 55%),var(--bg-app)}
  .setup-card{width:100%;max-width:380px}
  .setup-brand{font-family:var(--font-mono);font-weight:700;font-size:22px;letter-spacing:.02em;margin-bottom:24px}
  .setup-brand .accent{color:var(--brand)}
  .setup-card h1{font-size:20px;margin:0 0 6px;letter-spacing:-.02em}
  .setup-sub{color:var(--text-muted);font-size:13.5px;margin:0 0 24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}
  .err{color:var(--danger);font-size:12.5px;margin:0 0 14px;min-height:16px}
  .btn-primary{width:100%;height:42px;border:0;border-radius:var(--r);background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:700;cursor:pointer}
  .btn-primary:hover{background:var(--brand-strong)}
  .foot{text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;margin-top:22px}
</style>
</head>
<body>
  <div class="setup">
    <div class="setup-card">
      <div class="setup-brand mono">RE<b style="color:var(--brand)">X</b><span class="accent">Hub</span></div>
      <h1>设置管理员密码</h1>
      <p class="setup-sub">首次启动需设置单管理员密码。REX 为自托管单用户，密码仅在宿主机侧保存。</p>
      <div class="field"><label for="pw">新密码</label><input id="pw" type="password" class="input" placeholder="至少 6 位"></div>
      <div class="field"><label for="pw2">确认密码</label><input id="pw2" type="password" class="input"></div>
      <p class="err" id="err"></p>
      <button class="btn-primary" id="set">设置并进入</button>
      <div class="foot">REX Hub · build 1.0.0 · © 2026</div>
    </div>
  </div>
  <script src="assets/common.js"></script>
  <script>
    var pw = document.getElementById('pw'), pw2 = document.getElementById('pw2'), err = document.getElementById('err');
    var done = false;
    try { done = localStorage.getItem('rex-setup-done') === '1'; } catch (e) {}
    if (done) { err.textContent = '管理员密码已设置，请登录。'; }
    document.getElementById('set').addEventListener('click', function () {
      err.textContent = '';
      if (pw.value.length < 6) { err.textContent = '密码至少 6 位'; return; }
      if (pw.value !== pw2.value) { err.textContent = '两次输入不一致'; return; }
      try { localStorage.setItem('rex-setup-done', '1'); } catch (e) {}
      REX.toast('密码已设置', 'ok');
      setTimeout(function () { location.href = done ? '00-login.html' : '02-workspace.html'; }, 400);
    });
    pw2.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('set').click(); });
  </script>
</body>
</html>
