name: CI

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  HUB_IMAGE: ghcr.io/${{ github.repository_owner }}/rex-hub
  AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/rex-agent

jobs:
  # ── 格式检查（平台无关，只需一次） ──────────────
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check format
        run: cargo fmt --check

  # ── 构建 Rust 二进制（clippy → test → build，共享 release target 目录） ──
  # 产物用于：Docker Hub 镜像内嵌 + Release 发布
  build-binaries:
    needs: [fmt]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            arch: mac-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            arch: mac-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cross-compilation tools
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Clippy
        run: cargo clippy --workspace --release --target ${{ matrix.target }}
      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}
      - name: Build Agent + Hub
        run: cargo build --release -p rex-agent -p rex-hub --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/rex-agent*
            target/${{ matrix.target }}/release/rex-hub*

  # ── 构建前端（检查 + 构建合并） ──────────────────────
  # 流程：type-check → lint → test → build（避免重复构建）
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: packages/rex-console-web
      - run: bun run type-check
        working-directory: packages/rex-console-web
      - run: bun run lint
        working-directory: packages/rex-console-web
      - run: bun run test
        working-directory: packages/rex-console-web
      - run: bun run build
        working-directory: packages/rex-console-web
      - uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: packages/rex-console-web/dist/

  # ── Docker: Hub 镜像（包含所有平台 Agent 二进制） ─────
  docker-hub:
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download hub binary (linux-amd64)
        uses: actions/download-artifact@v8
        with:
          name: binaries-linux-amd64
          path: dist/hub-tmp/
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist/static/
      - name: Download all agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist/agents-tmp/
          merge-multiple: false
      - name: Organize binaries
        run: |
          # hub binary → dist/rex-hub
          cp dist/hub-tmp/rex-hub dist/rex-hub
          # agent binaries → dist/agents/{arch}/rex-agent
          for dir in dist/agents-tmp/binaries-*/; do
            arch=$(basename "$dir" | sed 's/^binaries-//')
            mkdir -p "dist/agents/$arch"
            cp "$dir"/rex-agent* "dist/agents/$arch/rex-agent"
          done
          rm -rf dist/hub-tmp dist/agents-tmp
          chmod +x dist/agents/*/rex-agent
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: type=ref,event=tag
      - name: Build and push Hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker: Agent 镜像（linux/amd64 + linux/arm64） ───
  docker-agent:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download linux agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-linux-*
          path: dist/
          merge-multiple: false
      - name: Organize agent binaries
        run: |
          cp dist/binaries-linux-amd64/rex-agent dist/rex-agent
          mkdir -p dist/arm64
          cp dist/binaries-linux-arm64/rex-agent dist/arm64/rex-agent
          rm -rf dist/binaries-*
      - run: cp docs/agent-readme.md README.md
      - name: Docker meta
        id: meta-agent
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: type=ref,event=tag
      - name: Build and push Agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release: GitHub Release + SHA256SUMS ─────
  release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts/
          merge-multiple: false
      - name: Prepare release binaries
        run: |
          for dir in artifacts/binaries-*/; do
            arch=$(basename "$dir" | sed 's/^binaries-//')
            cp "$dir"/rex-agent* "rex-agent-${arch}"
            cp "$dir"/rex-hub* "rex-hub-${arch}"
          done
          chmod +x rex-agent-* rex-hub-* 2>/dev/null || true
      - name: Generate SHA256SUMS
        run: sha256sum rex-hub-* rex-agent-* > SHA256SUMS
      - name: Extract changelog for release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No changelog entry for v${VERSION}" > release-body.md
          fi
          echo "" >> release-body.md
          echo "## SHA256SUMS" >> release-body.md
          echo '```' >> release-body.md
          cat SHA256SUMS >> release-body.md
          echo '```' >> release-body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: rex-hub-* rex-agent-* SHA256SUMS
