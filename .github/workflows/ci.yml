name: CI

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  HUB_IMAGE: ghcr.io/${{ github.repository_owner }}/rex-hub
  AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/rex-agent

jobs:
  # ── 检查（平台无关，只需一次） ──────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' }}
      - name: Check format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace
      - name: Test
        run: cargo test --workspace

  # ── 构建 Rust 二进制（5 平台矩阵，产物用于 Docker + Release） ──
  build-binaries:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
            arch: mac-amd64
          - target: aarch64-apple-darwin
            os: macos-14
            arch: mac-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch: windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cross-compilation tools
        if: matrix.cross
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      # Linux arm64 交叉：装 arm64 架构的 OpenSSL/zlib 开发库，并让 pkg-config
      # 指向 arm64 多架构路径（否则会拿到主机的 x86_64 库，架构不匹配）。
      - name: Install arm64 OpenSSL/zlib (Linux cross)
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y libssl-dev:arm64 zlib1g-dev:arm64
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"
      # 静态链接 OpenSSL/zlib（macOS/Linux/Windows 均静态，使二进制自包含）。
      - name: Static OpenSSL env
        run: |
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "ZLIB_STATIC=1" >> "$GITHUB_ENV"
      # macOS：arm64 目标用 Homebrew 的静态 openssl@3；x86_64 目标（arm64 runner
      # 交叉）Homebrew 只有 arm64 瓶，故源码构建 x86_64 静态 openssl 并指入。
      - name: openssl (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.arch }}" = "mac-amd64" ]; then
            VER=3.5.6
            curl -fsSL "https://www.openssl.org/source/openssl-${VER}.tar.gz" -o /tmp/openssl.tgz
            tar -xzf /tmp/openssl.tgz -C /tmp
            cd "/tmp/openssl-${VER}"
            ./Configure darwin64-x86_64-cc --prefix="$HOME/openssl-x86_64" --openssldir="$HOME/openssl-x86_64" no-shared no-tests
            make -j"$(sysctl -n hw.ncpu)"
            make install_sw
            echo "OPENSSL_ROOT_DIR=$HOME/openssl-x86_64" >> "$GITHUB_ENV"
            echo "OPENSSL_LIB_DIR=$HOME/openssl-x86_64/lib" >> "$GITHUB_ENV"
            echo "OPENSSL_INCLUDE_DIR=$HOME/openssl-x86_64/include" >> "$GITHUB_ENV"
          else
            brew install openssl@3
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
            echo "OPENSSL_LIB_DIR=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
            echo "OPENSSL_INCLUDE_DIR=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          fi
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress openssl
      - name: Build Agent + Hub
        run: cargo build --release -p rex-agent -p rex-hub --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/rex-agent*
            target/${{ matrix.target }}/release/rex-hub*

  # ── 构建前端（检查 + 构建合并） ──────────────────────
  # 流程：type-check → lint → test → build（避免重复构建）
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: packages/rex-console-web
      - run: bun run type-check
        working-directory: packages/rex-console-web
      - run: bun run lint
        working-directory: packages/rex-console-web
      - run: bun run test
        working-directory: packages/rex-console-web
      - run: bun run build
        working-directory: packages/rex-console-web
      - uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: packages/rex-console-web/dist/

  # ── Docker: Hub 镜像（包含所有平台 Agent 二进制） ─────
  docker-hub:
    needs: [build-binaries, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download hub binary (linux-amd64)
        uses: actions/download-artifact@v8
        with:
          name: binaries-linux-amd64
          path: dist/hub-tmp/
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist/static/
      - name: Download all agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist/agents-tmp/
          merge-multiple: false
      - name: Organize binaries
        run: |
          # hub binary → dist/rex-hub
          cp dist/hub-tmp/rex-hub dist/rex-hub
          # agent binaries → dist/agents/{arch}/rex-agent
          for dir in dist/agents-tmp/binaries-*/; do
            arch=$(basename "$dir" | sed 's/^binaries-//')
            mkdir -p "dist/agents/$arch"
            [ -f "$dir/rex-agent.exe" ] && cp "$dir/rex-agent.exe" "dist/agents/$arch/rex-agent.exe" || cp "$dir/rex-agent" "dist/agents/$arch/rex-agent"
          done
          rm -rf dist/hub-tmp dist/agents-tmp
          chmod +x dist/agents/*/rex-agent
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HUB_IMAGE }}
          tags: type=ref,event=tag
      - name: Build and push Hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker: Agent 镜像（linux/amd64 + linux/arm64） ───
  docker-agent:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download linux agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-linux-*
          path: dist/
          merge-multiple: false
      - name: Organize agent binaries
        run: |
          cp dist/binaries-linux-amd64/rex-agent dist/rex-amd64
          cp dist/binaries-linux-arm64/rex-agent dist/rex-arm64
          rm -rf dist/binaries-*
      - run: cp docs/agent-readme.md README.md
      - name: Docker meta
        id: meta-agent
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: type=ref,event=tag
      - name: Build and push Agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Release: GitHub Release + SHA256SUMS ─────
  release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: artifacts/
          merge-multiple: false
      - name: Prepare release binaries
        run: |
          echo "=== Artifacts downloaded ==="
          ls -la artifacts/ || echo "No artifacts dir"
          for dir in artifacts/binaries-*/; do
            echo "Processing $dir"
            ls -la "$dir"
            arch=$(basename "$dir" | sed 's/^binaries-//')
            if [ -f "$dir/rex-agent.exe" ]; then
              cp "$dir/rex-agent.exe" "rex-agent-${arch}.exe"
            elif [ -f "$dir/rex-agent" ]; then
              cp "$dir/rex-agent" "rex-agent-${arch}"
            fi
            if [ -f "$dir/rex-hub.exe" ]; then
              cp "$dir/rex-hub.exe" "rex-hub-${arch}.exe"
            elif [ -f "$dir/rex-hub" ]; then
              cp "$dir/rex-hub" "rex-hub-${arch}"
            fi
          done
          chmod +x rex-agent-* rex-hub-* 2>/dev/null || true
          echo "=== Release files ==="
          ls -la rex-agent-* rex-hub-* 2>/dev/null || echo "No release files found"
      - name: Generate SHA256SUMS
        run: sha256sum rex-hub* rex-agent* > SHA256SUMS
      - name: Extract changelog for release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No changelog entry for v${VERSION}" > release-body.md
          fi
          echo "" >> release-body.md
          echo "## SHA256SUMS" >> release-body.md
          echo '```' >> release-body.md
          cat SHA256SUMS >> release-body.md
          echo '```' >> release-body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-body.md
          files: |
            rex-hub-*
            rex-agent-*
            SHA256SUMS
