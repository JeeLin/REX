services:
  hub:
    image: ghcr.io/${GITHUB_REPO_OWNER}/rex-hub:latest
    restart: unless-stopped
    # Container-level safety net; in-container supervisor handles exit 10 / crash auto-restart.
    healthcheck:
      # Hub serves HTTP on 3000 even without TLS; probe the listen port.
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      # 端口说明：
      # - 3000：始终监听。无 TLS 时为 HTTP，启用 TLS 后为 HTTPS
      # - 80：仅 ACME HTTP-01 验证时需要（Let's Encrypt 验证域名所有权）
      # - 443：可选，额外的 HTTPS 入口（方便使用标准端口）
      - "3000:3000"
      - "80:80"      # ACME HTTP-01（启用 ACME 域名证书时需要，IP 证书不需要）
      # - "443:443"  # 可选：额外 HTTPS 入口
    volumes:
      - hub-data:/app/data
    environment:
      - REX_SECRET_KEY=${REX_SECRET_KEY}
      - DATA_DIR=/app/data
      # ═══ TLS 配置（三选一，都不设置则为 HTTP）══
      # 自签名模式（开发/测试，浏览器会警告证书不可信）
      # - REX_TLS_SELF_SIGNED=true
      # 手动证书模式（生产，提供 PEM 证书和私钥）
      # - REX_TLS_CERT=/app/data/certs/hub.crt
      # - REX_TLS_KEY=/app/data/certs/hub.key
      # ACME 模式（生产，自动从 Let's Encrypt 签发证书，需要域名指向此服务器）
      # - REX_ACME_DOMAIN=hub.example.com
      # - REX_ACME_EMAIL=admin@example.com
      # - REX_ACME_STAGING=false

volumes:
  hub-data:
    driver: local
