services:
  hub:
    image: ghcr.io/${GITHUB_REPO_OWNER}/rex-hub:latest
    restart: unless-stopped
    # Container-level safety net; in-container supervisor handles exit 10 / crash auto-restart.
    healthcheck:
      # Probe plain HTTP first, then HTTPS (TLS mode). Fails only if both fail.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || wget --no-check-certificate -q -O /dev/null https://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      # Hub listens on a single port (REX_PORT, default 3000): plain HTTP by
      # default, HTTPS on the same port once TLS is enabled. No port 80 needed.
      - "3000:3000"
      # - "443:3000"  # optional: expose TLS on standard 443 (map to REX_PORT)
    volumes:
      - hub-data:/app/data
    environment:
      - REX_DATA_DIR=/app/data
      # ═══ TLS 配置（二选一，都不设置则为 HTTP）══
      # Self-signed: first start generates {REX_DATA_DIR}/tls/*.pem (dev/test; browsers will warn)
      # - REX_TLS_SELF_SIGNED=true
      # Manual PEM pair: startup aborts if cert expired / key mismatch / path unreadable
      # - REX_TLS_CERT=/app/data/certs/hub.crt
      # - REX_TLS_KEY=/app/data/certs/hub.key

volumes:
  hub-data:
    driver: local
